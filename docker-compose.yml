# Deploys the app tier (this repo's FastAPI + React image) behind Caddy for
# automatic HTTPS. This file runs on the free-tier app EC2 instance.
#
# The VLM itself is deliberately NOT a service in this file — per
# docs/ARCHITECTURE.md it runs on a separate EC2 instance (GPU primary /
# CPU contingency) so the two tiers can be sized, scaled, and billed
# independently. Point the app at it via VLM_PRIMARY_BASE_URL in .env.
#
# The optional `cpu-inference` profile below runs Qwen2.5-VL locally via
# llama.cpp — useful for local development without any cloud dependency,
# or as a same-box stand-in for the CPU contingency path. It is NOT started
# by a plain `docker compose up`; opt in with:
#   docker compose --profile cpu-inference up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vlm-business-card-app:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-data:/srv/backend/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # --- optional: self-hosted CPU inference (Option A contingency) ---
  cpu-inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["cpu-inference"]
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - llama-models:/models
    environment:
      # Auto-downloads the quantized model + mmproj from Hugging Face on
      # first start and caches them in the llama-models volume.
      LLAMA_ARG_HF_REPO: "Qwen/Qwen2.5-VL-3B-Instruct-GGUF"
      LLAMA_ARG_HF_FILE: "qwen2.5-vl-3b-instruct-q4_k_m.gguf"
      LLAMA_ARG_MMPROJ_URL: "https://huggingface.co/Qwen/Qwen2.5-VL-3B-Instruct-GGUF/resolve/main/mmproj-qwen2.5-vl-3b-instruct-f16.gguf"
      LLAMA_ARG_CTX_SIZE: "4096"
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8000"

volumes:
  app-data:
  caddy-data:
  caddy-config:
  llama-models:
